<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindBloom - Extension Settings</title>
  <link rel="stylesheet" href="popup.css">
  <style>
    body {
      width: 480px;
      margin: 20px auto;
      border: 1px solid #E4E1D8;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }
    .options-form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .field-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    label {
      font-weight: 600;
      font-size: 13px;
      color: #1C1B19;
    }
    .input-field {
      padding: 8px 12px;
      border: 1px solid #E4E1D8;
      border-radius: 6px;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 12px;
      background-color: #FFFFFF;
      color: #1C1B19;
      width: 100%;
    }
    .input-field:focus {
      outline: none;
      border-color: #3D5A45;
    }
    .help-text {
      font-size: 11px;
      color: #6B6A63;
    }
    .btn-row {
      display: flex;
      gap: 10px;
    }
    .secondary-btn {
      background-color: #F3F2EE;
      color: #1C1B19;
      border: 1px solid #E4E1D8;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: 500;
      cursor: pointer;
    }
    .secondary-btn:hover {
      background-color: #E8E6DF;
    }
  </style>
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="brand">
        <span class="sprout-icon">🌱</span>
        <h1 class="logo">MindBloom Extension Settings</h1>
      </div>
    </header>

    <main class="content">
      <form id="settings-form" class="options-form" onsubmit="return false;">
        <div class="field-group">
          <label for="backend-url">MindBloom Backend Server URL</label>
          <input
            type="url"
            id="backend-url"
            class="input-field"
            placeholder="http://localhost:3000"
            required
          />
          <p class="help-text">
            Specify the URL of your MindBloom server. Default is <code>http://localhost:3000</code> or your deployed Cloud Run URL.
          </p>
        </div>

        <div id="test-status" class="status-card hidden">
          <p id="test-status-text" class="status-text"></p>
        </div>

        <div class="btn-row">
          <button type="button" id="test-btn" class="secondary-btn">🔍 Test Connection</button>
          <button type="button" id="save-btn" class="primary-btn">💾 Save Configuration</button>
        </div>
      </form>
    </main>
  </div>

  <script src="options.js"></script>
</body>
</html>
